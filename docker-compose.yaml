services:
  db:
    container_name: football-postgres
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: football_db
      POSTGRES_USER: football_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    container_name: football-web

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8088:8080"

    environment:
      JDBC_URL: jdbc:postgresql://db:5432/football_db
      DB_USER: football_app
      DB_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./src/main/webapp:/opt/dev/webapp:ro

volumes:
  postgres_data:
